# cargo-nextest settings: https://nexte.st/docs/configuration/

[profile.default]
# Locally: stop at the first failure, and never retry (a flaky test
# should be fixed, not hidden).
fail-fast = true
retries = 0
# Report tests slower than 15 s (the slowest take 7-9 s); kill one still
# running after 60 s, so a hang can't stall a run.
slow-timeout = { period = "15s", terminate-after = 4 }

[profile.ci]
# In CI: run everything, retry twice to tell flaky from broken, and write
# JUnit for the CI's test report.
fail-fast = false
retries = 2

[profile.ci.junit]
path = "junit.xml"

# Builds 400 random trees and walks each several times on rayon's pool:
# 2-3 s alone, but past 60 s on CI's macOS runner among 11 other tests on
# few cores. It runs by itself, everywhere.
[[profile.default.overrides]]
filter = 'test(=discover::tests::link_optimizations_agree_with_the_plain_walk_on_random_trees)'
threads-required = "num-test-threads"

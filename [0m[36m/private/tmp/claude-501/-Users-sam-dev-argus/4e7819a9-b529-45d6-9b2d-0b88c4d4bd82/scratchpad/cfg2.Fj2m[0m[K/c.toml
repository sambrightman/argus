## argus configuration (generated by argus 0.4.0).
##
## Every setting is listed with its default, commented out: delete the
## leading "# " to change one. `argus root add|remove` edit this file in
## place and keep your comments.

## Config files this one builds on, e.g. `["~/.config/argus/work.toml",
## "conf.d/*.toml"]`: read first, in order (later ones win), then this file's
## settings override theirs, wherever this line is. Paths are relative to this
## file, `~` allowed, `*` etc. in the file name (matching nothing is fine).
## Lists of tables (`[[track]]`) add up. Separately, any list setting also
## takes `extend_<name>` to add to the list rather than replace it, e.g.
## `extend_exclude_paths = ["build-cache"]`.
# extend = []

## Directories scanned (recursively) for repositories. When empty, the current
## directory is scanned, and the repo it's in from that repo's top. Manage
## with `argus root add|remove|list`.
##   e.g. ["~/dev"]
# roots = []

## Directories never descended into (roots are always scanned). Like
## gitignore: a pattern without `/` is a directory name at any depth
## (`node_modules`, `*.egg-info`); one starting with `/` or `~` is a full path
## (`~/dev/archive`, `~/src/*/third_party`); any other with `/` is below each
## root (`go/pkg`). Globs: `*` (within one level), `**`, `?`, `[ab]`, `{a,b}`.
## Unlike `ignore`, which hides repos, repos there aren't scanned at all.
# exclude_paths = [
#   "node_modules",
#   "target",
#   ".venv",
#   "venv",
#   "__pycache__",
#   ".tox",
#   "vendor",
#   "dist",
#   "build",
#   ".cache",
#   ".direnv",
#   ".terraform",
#   "Library",
#   "go/pkg",
# ]

## Maximum directory depth below a root; deeper directories are skipped (with
## a warning). 0: no limit.
# max_depth = 6

## Skip directories whose name starts with `.`; add one as a root to scan it.
# skip_hidden = true

## Keep scanning inside each repo's work tree for repos nested in it (not
## submodules: those are found from their parent either way). Slower: every
## work tree is walked, so keep `exclude_paths` up to date.
# scan_inside_repos = false

## Follow symlinks to directories (`-L`). Cycles are cut and a repo reachable
## by several paths is listed once.
# follow_symlinks = false

## Stay on each root's filesystem (`-x`): don't enter other mounts (network
## shares, external disks) below a root, or follow links to them. Unix only.
# one_file_system = false

## How many commits back to look for a tag to describe a detached HEAD by
## (`v1.2-3-g1a2b3c4`, as `git describe --tags`). Opening the repo's details
## looks all the way back. 0: only when the details open.
# describe_limit = 1000

## Protocol for new clones; unset asks the forge (`gh config get
## git_protocol`).
## One of:
##   ssh
##   https
## Unset by default; for example:
# clone_protocol = "ssh"

## How much runs at once.
# [concurrency]
## Discovery and status: file system calls on this machine, mostly answered
## from memory. Beyond a point they slow each other down in the kernel. 0:
## automatic, i.e. the performance-core count where cores differ (Apple
## silicon), else half the CPUs.
# disk = 0
## Network operations (fetch/pull/push/clone). 0: automatic, i.e. git's
## `fetch.parallel` if set above 0, else the CPU count up to 8 (forges and ssh
## limit simultaneous connections).
# network = 0

## Auto-fix behaviour.
# [fix]
## Fixes an auto-fix action may apply, highest priority first. Each action
## applies one: the first in this list that the repo needs.
## One of:
##   abort: End the merge, rebase, cherry-pick, revert, am or bisect in
##          progress, losing its progress (never automatic: confirmed first).
##   stash: Stash staged, unstaged and untracked changes (not ignored files).
##   commit: Commit everything (never automatic: needs a message).
##   gitignore: Add the untracked files to a gitignore (never automatic: which
##              file, and anchored or not, are asked).
##   branch: Name the commits a detached HEAD has on no branch: create a
##           branch there (never automatic: needs a name).
##   push: Push commits to the current branch's remote branch (fast-forward
##         only): its upstream when that's the same-named branch, else the
##         same-named branch on its push remote, never a differently named
##         upstream such as the `main` a feature branch pulls from.
##   publish: Put the current branch on the remote: push and set the upstream
##            when it has none or its upstream is gone; push to its own name
##            when it pulls from another branch.
##   add-remote: Add a remote to a repo with none (never automatic: needs a
##               URL).
##   push-branches: Push other local branches to their remote branches, as
##                  `push` would (existing ones only, fast-forward only).
##   switch-default: Leave a fully pushed / merged branch for the default
##                   branch.
##   reattach: Switch a detached HEAD to the branch at the same commit.
##   pull: Pull the current branch (your pull settings apply).
##   fast-forward: Fast-forward local branches that aren't checked out.
##   delete-branches: Delete branches merged into the default branch whose
##                    upstream is gone or that have none (never automatic:
##                    confirmed first).
##   stash-pop: Pop the newest stash into a work tree with no tracked changes,
##              if it applies without conflicts.
##   submodule-update: Check submodules at another commit than recorded out at
##                     the recorded one, when their commit is on a branch (or
##                     other ref) and they have no changes of their own:
##                     nothing is lost.
##   prune-worktrees: Delete the records of linked worktrees whose folder is
##                    gone (not locked ones): nothing on disk is lost.
##   remove-worktree: Remove a finished linked worktree (`git worktree
##                    remove`): its folder goes, ignored files in it too; the
##                    branch stays (never automatic: confirmed first).
# auto = [
#   "push",
#   "push-branches",
#   "switch-default",
#   "reattach",
#   "fast-forward",
# ]

## Defaults for stashing: the `z` menu, `argus stash`, the stash fix.
# [stash]
## Include untracked files.
# untracked = true
## Leave staged changes in the index after stashing them (`--keep-index`).
# keep_index = false
## In the TUI's stash menu: ask for a message before stashing (else `argus
## <date> <time>`).
# message = false

## External programs.
# [tools]
## Shell for "drop to shell"; unset means `$SHELL`.
## Unset by default; for example:
# shell = "/bin/zsh"
## Command for a full git UI, run in the repo dir, e.g. `lazygit` or
## `emacsclient -t -e '(magit-status)'`.
## Unset by default; for example:
# git_ui = "lazygit"
## Editor for opening a repo; unset means `$VISUAL`, then `$EDITOR`.
## Unset by default; for example:
# editor = "code --wait"

## Appearance and startup view of the TUI.
# [ui]
## Built-in theme name (`terminal`, `dark`, `light`, `mono`).
# theme = "terminal"
## Per-role colour overrides: a name, `#rrggbb`, 0-255, optionally with
## modifiers and background, e.g. `"bold black on #ffcc00"`.
##   e.g. { branch = "bold magenta", "tag.favourite" = "yellow" }
# colors = {}
## Icon set: `unicode` (default), `nerd` (Nerd Font glyphs) or `ascii`.
# icons = "unicode"
## Per-icon overrides on top of the set, by name: favourite, new, ignored,
## snoozed, branch, detached, detached_commits, ahead, behind, staged,
## unstaged, untracked, conflict, stash, in_progress, gone, no_upstream,
## no_remote, branches, off_default, finished_worktree, stale_worktrees,
## error, pull, worktree, submodule; and in the interface: spinner (one frame
## per character), marked, partly_marked, marked_repo, divider (repeated,
## between a menu's parts), folded and unfolded (before a message holding
## more), ok, failed, celebrate, and the ignore menu's issue states
## issue_counted, issue_pinned, issue_ignored.
##   e.g. { pull = "⇣" }
# icon_overrides = {}
## Show only repos needing attention at startup (`a` toggles).
# attention_only = true
## Highlight the changed words in diffs: in every hunk, only the hunk under
## the cursor, or none.
## One of:
##   all
##   selected
##   off
# refine = "all"
## Look up a repo's pull requests and open issues on its forge when its
## details are opened, to show there (GitHub, with the token `gh` or
## `GH_TOKEN` gives).
# forge_info = true

## Tags, each a table: `favourite` (sort points 1, `f` in the Tag menu) and
## any of your own, `[tags.<name>]`, a word of letters, digits, `-` and `_`.
## They show in the flag column and filter (`/` with `#name`, `argus status
## --tag name`). Two do something: `pull` is the repos `argus pull` pulls (a
## tracked owner's are, unless an entry turns one off:
## `"!acme/huge-monorepo"`), and `ignore` the repos hidden and left out of
## pulls, clones and bulk operations, with `[tags.ignore.issues]` for what not
## to flag in repos that stay listed.
## A tag (`[tags.<name>]`): which repos have it, and how it looks and sorts.
# [tags.favourite]
## Its key in the TUI's Tag menu (`t`), one character.
# key = "f"
## Its icon in the flag column: one for every icon set, or by set (`{ unicode
## = "◆", nerd = "…", ascii = "*" }`; unicode stands in for one left out).
## None: the name's first letter (pull and ignore: the icon set's, as `[ui]
## icon_overrides` has them).
# icon = { unicode = "◆", nerd = " ", ascii = "*" }
## Its colour, as in `[ui] colors`. Coming first: `[ui] colors` naming it
## (`"tag.<name>"`), then the theme's own for it. (An ignored repo takes `[ui]
## colors` `hidden`, not this.)
## Unset by default.
## Sort points: repos sort by the sum of their tags' (after needing attention,
## before severity). A tag with points gives way to ignoring a repo, and stops
## it being ignored; one without (a label) doesn't. (Ignore's own aren't
## counted: it hides.)
# sort = 1
## Repos with the tag. Each entry is a repo or a pattern, matched against its
## identity (`github.com/acme/app`), `owner/name` or path (`~/dev/x`); `*`
## stays within one level, `**` crosses them. Later entries win, and `!` turns
## it off again: `["acme/*", "!acme/legacy"]`. Tagging from the TUI or `argus
## tag` edits it.
# repos = []
##
## Likewise, with its own defaults:
# [tags.pull]
# key = "p"
# sort = 0
# repos = []
##
## Likewise, with its own defaults:
# [tags.ignore]
# key = "I"
# sort = 0
# repos = []

## `[tags.ignore.issues]`: an issue, and the repos not to flag it in. Entries
## as for a tag's `repos` (a repo or a pattern, matched against identity,
## `owner/name` or path; the last match wins, `!` turns it off).
# [tags.ignore.issues]
## Repos normally on a branch other than the default. `repo@branch` ignores
## only that branch (glob allowed), so another is flagged.
##   e.g. ["acme/legacy@release-*"]
# non_default_branch = []
## Repos normally on a detached HEAD. `repo@value` ignores only that: a tag on
## HEAD, its describe (`v1.2-3-g1a2b3c4`) or its commit id (7 characters or
## all of it); glob allowed.
##   e.g. ["acme/pinned-dep@v1.2.0"]
# detached = []
## Repos with no remote.
# no_remote = []
## Repos whose branch has no upstream. `repo@branch` as for
## `non_default_branch`.
# no_upstream = []
## Repos with stashes, stash by stash: `repo@message` covers stashes whose
## message (after git's `On <branch>: `) matches (glob allowed). By default,
## every stash but those argus's stash fix made.
# stashes = ["**", "!**@argus *"]
## Repos with other local branches holding unpushed commits.
# unpushed_branches = []
## Repos behind their upstream.
# behind = []
##
## One of your own, for example:
# [tags.work]
# key = "w"
# icon = "W"
# color = "cyan"
# sort = 0
# repos = ["acme/*", "!acme/legacy"]

## Forge owners (orgs/users/teams) whose repos should all be cloned and
## pulled. Their repos are pulled unless `pull` turns them off.
# [[track]]
## Forge kind: `github`, or `dir` for a directory of repos (mirrors, a file
## server): a directory per owner, holding bare or plain repos.
# forge = "github"
## Forge host (GitHub Enterprise: your host; `dir`: the directory).
# host = "github.com"
## Org or user.
## Required.
# owner = "my-org"
## Restrict to an org team's repositories (team slug).
## Unset by default; for example:
# team = "platform"
## Where new clones go; unset means `<first root>/<owner>`.
## Unset by default; for example:
# into = "~/dev/my-org"
## What `argus pull` does with repos missing locally.
## One of:
##   auto: Clone repos missing locally during `argus pull` (flagged as new).
##   notify: Only report repos missing locally.
# clone = "auto"
## Pull this owner's repos with `argus pull`.
# pull = true
## Also clone archived repos.
# include_archived = false
## Also clone forks.
# include_forks = true

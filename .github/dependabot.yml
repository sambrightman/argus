version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Only versions out for two weeks; security updates ignore this.
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only versions out for two weeks; security updates ignore this.
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

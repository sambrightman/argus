name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental caches are large and rarely reused on a fresh runner.
  CARGO_INCREMENTAL: 0
  # Line numbers in backtraces, without the size of full debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUST_BACKTRACE: 1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete
      - run: cargo machete

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          # Most tests wait on git processes and the filesystem, which the
          # 3-core macOS runners are slow at: 12 at once took 53 s, against
          # 180 s at the default 3 (and 138 s at 6).
          - os: macos-latest
            threads: 12
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_TEST_THREADS: ${{ matrix.threads || 'num-cpus' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: runner.os == 'Linux'
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
      - run: cargo nextest run --workspace --locked --profile ci
      # nextest doesn't run doctests.
      - run: cargo test --workspace --locked --doc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml

  # Mutants in the code this push or PR changed; the full run is weekly
  # (mutants.yml). Skips the baseline, as the test job runs alongside.
  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      - name: Diff
        env:
          # A PR's base, or the commit main pointed at before this push
          # (absent for a new branch, unreachable after a force-push: then
          # just the last commit).
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          git diff "$(git merge-base "$BASE" HEAD)" HEAD > ../changes.diff
          git diff --stat "$(git merge-base "$BASE" HEAD)" HEAD | tail -1
      # On a PR, review comments (mutants-review.yml) instead of
      # cargo-mutants' warnings.
      - run: >-
          cargo mutants --in-place --baseline=skip --timeout 300 --in-diff ../changes.diff
          ${{ github.event_name == 'pull_request' && '--annotations=none' || '' }}
      # This job's token can't comment on a PR from a fork (it's read-only
      # there), so the misses and the PR's number go to a workflow that can.
      - name: Missed mutants for review
        if: ${{ failure() && github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.number }}
        run: |
          mkdir review
          cp mutants.out/missed.txt review/
          echo "$PR" > review/pr
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && github.event_name == 'pull_request' }}
        with:
          name: mutants-review
          path: review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: mutants-in-diff
          path: mutants.out

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Keep in step with rust-version in Cargo.toml.
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  coverage:
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo llvm-cov nextest --workspace --locked --profile ci --no-report
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
      # Skipped until the CODECOV_TOKEN secret exists.
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: ${{ env.CODECOV_TOKEN != '' }}
        with:
          files: lcov.info
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

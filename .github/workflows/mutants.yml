name: Mutants

# The full cargo-mutants run (about 2,500 mutants) takes hours, so it runs
# weekly and on demand, split into shards that run in parallel, on Linux.
# cargo-mutants doesn't evaluate #[cfg], so code for another platform looks
# untested there: the files with such code (MACOS_FILES) are mutated on
# macOS too, and their mutants count only if missed on both. macOS runners
# are slow and few, so it does just those.
#
# Run by hand with `-f shard=Linux-9`, it runs that one shard, logging the
# runner's memory, caches, /tmp and biggest processes as it goes: for a
# shard whose runner is lost (no summary then, as there's nothing to judge).
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      shard:
        description: "Only this shard, its resources logged (e.g. Linux-9, macOS-1)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # files with code for one platform only (#[cfg(target_os/unix)])
  MACOS_FILES: >-
    crates/argus-core/src/config.rs
    crates/argus-core/src/discover.rs
    crates/argus-tui/src/lib.rs

jobs:
  # The shards: 16 on Linux, 4 on macOS; or the one asked for.
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - id: plan
        env:
          ONLY: ${{ inputs.shard }}
        run: |
          all=()
          for n in $(seq 0 15); do all+=("ubuntu-latest Linux $n 16"); done
          for n in $(seq 0 3); do all+=("macos-latest macOS $n 4"); done
          shards=$(for s in "${all[@]}"; do
            read -r os name n of <<< "$s"
            if [ -z "$ONLY" ] || [ "$ONLY" = "$name-$n" ]; then
              printf '{"os":"%s","name":"%s","shard":%s,"of":%s}\n' "$os" "$name" "$n" "$of"
            fi
          done | jq -sc .)
          if [ "$shards" = "[]" ]; then
            echo "::error::no shard $ONLY: Linux-0 to Linux-15, macOS-0 to macOS-3"
            exit 1
          fi
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: shard (${{ matrix.os }}, ${{ matrix.shard }}, ${{ matrix.of }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
        if: runner.os == 'Linux'
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-mutants,cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: false
      # The CI workflow already shows the tests pass, so each shard skips
      # the baseline run; --in-place reuses the cached build instead of
      # copying the tree. Exit 2 (missed) and 3 (timeouts) still produce a
      # report: the summary job judges those.
      #
      # Every mutant's outcome is printed, not only the misses: a mutant
      # that makes a loop allocate without end (an index that never grows)
      # fills the runner's memory before the timeout, and the runner is
      # shut down with the shard's results; the log then names the last
      # mutant it was on. Loops that step an index by hand are best made
      # iterators, which leave no such mutant.
      #
      # One shard run by hand on Linux also logs its runner's resources every
      # 30s, to the log (which streams out as the run goes) and to
      # resources.log (kept if the runner lasts).
      - name: Mutants
        env:
          SHARD: ${{ matrix.shard }}/${{ matrix.of }}
          WATCH: ${{ inputs.shard != '' }}
        run: |
          files=()
          if [ "$RUNNER_OS" = macOS ]; then
            read -ra macos <<< "$MACOS_FILES"
            for f in "${macos[@]}"; do files+=(-f "$f"); done
          fi
          if [ "$WATCH" = true ] && [ "$RUNNER_OS" = Linux ]; then
            {
              set +e  # (a command failing mustn't end the log)
              echo "== /tmp: $(findmnt -no FSTYPE,SIZE,SOURCE --target /tmp); $(nproc) cores"
              while :; do
                echo "== $(date -u +%T)"
                free -m | sed -n '2,3p'
                grep -E '^(Slab|SReclaimable|SUnreclaim|Shmem|Committed_AS):' /proc/meminfo \
                  | tr -s ' ' | paste -sd ' ' -
                df -h --output=target,used,avail,pcent / /tmp | tail -n +2 | tr -s ' ' | paste -sd ' ' -
                echo "tmp: $(find /tmp -maxdepth 1 -name '.tmp*' | wc -l) sandboxes," \
                  "$(du -sm /tmp 2>/dev/null | cut -f1)MB; $(ps -e --no-headers | wc -l) processes"
                ps -eo rss=,comm= --sort=-rss | head -5 \
                  | awk '{printf "%dMB %s  ", $1 / 1024, $2} END {print ""}'
                sleep 30
              done
            } 2>&1 | tee resources.log &
          fi
          set +e
          cargo mutants --in-place --baseline=skip --timeout 300 --shard "$SHARD" \
            --caught --unviable "${files[@]}"
          rc=$?
          [ $rc -eq 0 ] || [ $rc -eq 2 ] || [ $rc -eq 3 ] || exit $rc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mutants-${{ runner.os }}-${{ matrix.shard }}
          path: mutants.out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && inputs.shard != '' }}
        with:
          name: resources-${{ runner.os }}-${{ matrix.shard }}
          path: resources.log
          if-no-files-found: ignore

  summary:
    needs: shard
    if: ${{ !cancelled() && inputs.shard == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
      # Uncaught on Linux, and for MACOS_FILES on macOS too: a mutant caught
      # on either is covered.
      - name: Report
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          for os in Linux macOS; do
            for f in caught missed timeout unviable; do
              cat mutants-"$os"-*/"$f.txt" 2>/dev/null | sort -u > "$os-$f.txt"
            done
            sort -u "$os-missed.txt" "$os-timeout.txt" > "$os-uncaught.txt"
          done
          read -ra macos <<< "$MACOS_FILES"
          both=$(printf '%s\n' "${macos[@]}" | sed 's/[.]/\\./g; s/^/^/; s/$/:/' | paste -sd '|' -)
          # (grep finding nothing is fine: GitHub runs this with pipefail)
          {
            grep -vE "$both" Linux-uncaught.txt || true
            { grep -E "$both" Linux-uncaught.txt || true; } | comm -12 - macOS-uncaught.txt
          } | sort > uncaught.txt
          comm -12 uncaught.txt <(sort -u Linux-missed.txt macOS-missed.txt) > missed.txt
          comm -23 uncaught.txt missed.txt > timeout.txt
          {
            for os in Linux macOS; do
              echo "$os: caught $(wc -l < "$os-caught.txt"), missed $(wc -l < "$os-missed.txt"), timeouts $(wc -l < "$os-timeout.txt"), unviable $(wc -l < "$os-unviable.txt")"
              echo
            done
            echo "uncaught: missed $(wc -l < missed.txt), timeouts $(wc -l < timeout.txt)"
            for f in missed timeout; do
              if [ -s "$f.txt" ]; then
                printf '\n### %s\n\n```\n' "$f"
                cat "$f.txt"
                echo '```'
              fi
            done
            # A failed shard's mutants are absent from its platform's
            # lists, which would hide them from the intersection.
            if [ "$SHARDS" != success ]; then
              echo
              echo "Some shards didn't finish: the result is incomplete."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # The report is written either way (on the run's summary page); this
      # says whether it passes, and why not.
      - name: Check
        env:
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::Some shards didn't finish (e.g. no runner): the result is incomplete"
            exit 1
          fi
          missed=$(wc -l < missed.txt) timeouts=$(wc -l < timeout.txt)
          if [ "$missed" -gt 0 ] || [ "$timeouts" -gt 0 ]; then
            echo "::error::$missed missed and $timeouts timed out (listed on the summary page)"
            exit 1
          fi
          echo "every mutant caught"


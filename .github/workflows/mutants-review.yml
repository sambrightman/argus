name: Mutants review

# A PR's missed mutants (from its CI run's mutants job) as review comments
# on its lines. CI on a PR from a fork has a read-only token, so this runs
# after it, from this repository's own copy of this file, with permission
# to comment. Nothing from the PR runs here: the artifact's list and PR
# number are only read, and the number must name the PR whose head CI ran.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # the CI run's artifact
      pull-requests: write
    steps:
      # absent when CI failed for another reason
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: mutants-review
          path: review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: The PR
        if: steps.download.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=$(head -c 20 review/pr | tr -d '[:space:]')
          [[ $pr =~ ^[0-9]+$ ]] || { echo "not a PR number: $pr"; exit 1; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.head.sha + " " + .head.ref')
          [ "${head%% *}" = "$HEAD_SHA" ] || { echo "PR $pr's head isn't $HEAD_SHA"; exit 1; }
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "ref=${head#* }" >> "$GITHUB_OUTPUT"
      # this repository's code (for the paths), not the PR's
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pr.outcome == 'success'
        with:
          path: repo
          persist-credentials: false
      - uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        if: steps.pr.outcome == 'success'
        with:
          reviewdog_version: v0.21.3
      - name: Review comments
        if: steps.pr.outcome == 'success'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          REF: ${{ steps.pr.outputs.ref }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # reviewdog takes the PR from the event; this one isn't a PR's
          jq -n --argjson pr "$PR" --arg sha "$HEAD_SHA" --arg ref "$REF" \
            --arg owner "${GITHUB_REPOSITORY%/*}" --arg name "${GITHUB_REPOSITORY#*/}" \
            '{repository: {owner: {login: $owner}, name: $name},
              pull_request: {number: $pr, head: {sha: $sha, ref: $ref}}}' > "$RUNNER_TEMP/event.json"
          cd repo
          GITHUB_EVENT_PATH="$RUNNER_TEMP/event.json" reviewdog -efm='%f:%l:%c: %m' -name=mutants \
            -reporter=github-pr-review -filter-mode=added -fail-level=none < ../review/missed.txt

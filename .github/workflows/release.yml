name: Release

# A tag `v1.2.3` (matching the version in Cargo.toml) builds argus for
# macOS and Linux, publishes a GitHub release with the archives and their
# SHA-256 sums, and publishes the crates to crates.io. Run by hand, it
# builds and packages everything but publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: static, so they run on any distribution
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # ring's C code, for TLS
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "argus-git") | .version')
          test "${GITHUB_REF_NAME#v}" = "$version" \
            || { echo "tag $GITHUB_REF_NAME, but Cargo.toml says $version"; exit 1; }
      - run: cargo build --locked --profile dist --package argus-git --target ${{ matrix.target }}
      - name: Package
        run: |
          name="argus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/dist/argus" README.md LICENSE-APACHE LICENSE-MIT "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: argus-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "argus $GITHUB_REF_NAME" --generate-notes

  # crates.io by trusted publishing (a short-lived token; no secret), which
  # each crate allows once it exists: its first version is published by
  # hand. Crates already there at this version are skipped, so that first
  # tag, or a re-run after a partial failure, goes through.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: cargo publish --workspace --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: startsWith(github.ref, 'refs/tags/')
        id: auth
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # dependencies first
          for p in argus-git-core argus-git-forge argus-git-tui argus-git; do
            if curl -sf -A "argus-git release (github.com/$GITHUB_REPOSITORY)" \
                "https://crates.io/api/v1/crates/$p/$version" >/dev/null; then
              echo "$p $version is already on crates.io"
            else
              cargo publish --locked --package "$p"
            fi
          done

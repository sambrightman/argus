[package]
name = "argus"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argus-core = { version = "0.1.0", path = "../argus-core", features = ["demo"] }
argus-forge = { version = "0.1.0", path = "../argus-forge" }
argus-tui = { version = "0.1.0", path = "../argus-tui" }
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.39"
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
argus-core = { path = "../argus-core", features = ["testkit"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[package]
name = "argus-git"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "See which of your many git clones need attention, clean them up, and keep them (and whole GitHub orgs) up to date. TUI first, CLI for scripts and cron. Installs the `argus` command."
readme = "../../README.md"
keywords = ["git", "tui", "cli", "repositories", "github"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argus-core = { package = "argus-git-core", version = "0.6.0-pre.2", path = "../argus-core", features = ["demo"] }
argus-forge = { package = "argus-git-forge", version = "0.6.0-pre.2", path = "../argus-forge" }
argus-tui = { package = "argus-git-tui", version = "0.6.0-pre.2", path = "../argus-tui" }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
jiff = "0.2.39"
serde = "1.0.229"
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
argus-core = { package = "argus-git-core", path = "../argus-core", features = ["testkit"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints]
workspace = true

# cargo-release: the changelog's Unreleased section becomes the release's,
# a new one starts, and the checks run before the release commit (the
# rest of the setup is release.toml's).
[package.metadata.release]
pre-release-hook = ["../../scripts/release-checks.sh"]
pre-release-replacements = [
    { file = "../../CHANGELOG.md", search = "## Unreleased - ReleaseDate", replace = "## {{version}} - {{date}}", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "\\.\\.\\.HEAD", replace = "...v{{version}}", exactly = 1 },
    { file = "../../CHANGELOG.md", search = "<!-- next-header -->", replace = "<!-- next-header -->\n## Unreleased - ReleaseDate\n\n**Full Changelog**: https://github.com/sambrightman/argus/compare/v{{version}}...HEAD\n", exactly = 1 },
]

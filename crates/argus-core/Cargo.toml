[package]
name = "argus-core"
version = "0.1.0"
edition = "2024"

[dependencies]
tempfile = { version = "3.27.0", optional = true }
crossbeam-channel = "0.5.17"
gix = { version = "0.90.0", default-features = false, features = ["attributes", "dirwalk", "excludes", "index", "max-performance", "parallel", "revision", "sha1", "status"] }
globset = "0.4.21"
jiff = { version = "0.2.39", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.0"

[dev-dependencies]
argus-core = { path = ".", features = ["testkit"] }
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[features]
testkit = ["dep:tempfile"]

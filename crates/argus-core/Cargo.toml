[package]
name = "argus-git-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Internal crate of argus-git (discovery, status, fixes, config); no stability guarantees."

# The name the code uses (the package name was taken on crates.io).
[lib]
name = "argus_core"

[dependencies]
tempfile = { version = "3.27.0", optional = true }
gix = { version = "0.90.0", default-features = false, features = ["attributes", "dirwalk", "excludes", "index", "max-performance", "parallel", "revision", "sha1", "status"] }
globset = "0.4.21"
jiff = { version = "0.2.39", features = ["serde"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = { version = "1.2.0", features = ["preserve_order"] }
schemars = { version = "1", features = ["preserve_order", "indexmap2"] }
indexmap = { version = "2.14.2", features = ["serde"] }
toml_edit = "0.25.18"
serde_json = "1.0.154"

[dev-dependencies]
argus-core = { package = "argus-git-core", path = ".", features = ["testkit", "demo"] }
criterion = "0.8.2"
pretty_assertions = "1.4.1"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "core"
harness = false

[features]
testkit = ["dep:tempfile"]
demo = ["testkit"]

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sysctl = "0.7.1"

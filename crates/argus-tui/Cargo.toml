[package]
name = "argus-tui"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
argus-core = { version = "0.1.0", path = "../argus-core" }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
jiff = "0.2.39"
ratatui = "0.30.2"
rayon = "1.12.0"
similar = "3.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
argus-core = { path = "../argus-core", features = ["testkit", "demo"] }
criterion = "0.8.2"
insta = "1.49.0"
pretty_assertions = "1.4.1"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "tui"
harness = false

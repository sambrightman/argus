[package]
name = "argus-git-tui"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Internal crate of argus-git (the terminal UI); no stability guarantees."

# The name the code uses (the package name was taken on crates.io).
[lib]
name = "argus_tui"

[dependencies]
argus-git-core = { version = "0.1.0", path = "../argus-core" }
crossbeam-channel = "0.5.17"
crossterm = "0.29.0"
jiff = "0.2.39"
ratatui = "0.30.2"
rayon = "1.12.0"
similar = "3.2.1"
unicode-width = "0.2.3"

[dev-dependencies]
argus-git-core = { path = "../argus-core", features = ["testkit", "demo"] }
criterion = "0.8.2"
insta = "1.49.0"
pretty_assertions = "1.4.1"
proptest = "1.12.0"
tempfile = "3.27.0"

[[bench]]
name = "tui"
harness = false

[lints]
workspace = true

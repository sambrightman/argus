[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/sambrightman/argus"

# No unsafe code in our crates (dependencies may use it). Each crate
# opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

# Release builds (release.yml): faster, slower to build. Symbols are kept
# (only debug info is stripped, as in any release build), so a panic's
# backtrace names functions.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
